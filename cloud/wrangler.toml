# AMV's cloud computer - a Worker of its own that runs one container per person.
# Deploy from this folder once the main Worker is live and your Cloudflare plan
# includes Containers (Workers Paid). See GO-LIVE.md, "AMV's cloud computer".
#
#   cd cloud && npm install && npx wrangler deploy   (node build.mjs keeps amv-bridge.mjs here current)
#   npx wrangler secret put AMV_COMPUTER_KEY      # the same value as the main Worker's
name = "amv-computer"
main = "computer.mjs"
compatibility_date = "2026-06-01"

[[containers]]
class_name = "AMVComputer"
image = "./Dockerfile"
# A quarter of a CPU, 1 GiB of memory and 4 GB of disk: enough for npm and pip
# installs and a test run. The smallest size fails a typical install.
instance_type = "basic"
# Concurrent containers across ALL users. Raise it as the account grows; it is
# the ceiling on what an abuse wave can cost before the per-plan minutes stop it.
max_instances = 50

[[durable_objects.bindings]]
name = "AMV_COMPUTER"
class_name = "AMVComputer"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["AMVComputer"]
