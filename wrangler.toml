name = "amv-ai"
main = "amv-backend.js"
compatibility_date = "2024-09-23"

# ── WITHOUT THIS, TURNING ON THE BROWSER LATER DOES NOTHING ──
# @cloudflare/puppeteer imports node:buffer. A Worker has no Node built-ins
# unless this flag says so, so the import fails - and it fails in the ONE place
# designed to survive it, the guarded dynamic import in browserRun. That catch
# answers "the browser driver is not installed in this deployment. Run npm
# install and redeploy", which would be wrong twice over: it IS installed, and
# redeploying would not change anything.
#
# So the failure mode was: pay for the Workers paid plan, uncomment [browser],
# and web automation still refuses - permanently, politely, and pointing at the
# wrong fix. Found by running the Worker in workerd rather than by reading it;
# wrangler warns about it at startup and nothing was listening.
#
# nodejs_compat is safe to set now rather than later. With a compatibility_date
# of 2024-09-23 or newer it is the v2 behaviour, it only ADDS the Node built-ins
# a module may import, and the Worker's own code imports none of them - so it
# changes nothing until the browser driver is actually loaded. Setting it later,
# on the day the binding goes on, means discovering this on the day.
compatibility_flags = ["nodejs_compat"]

# ── THIS is what makes automations run in the background ──
# Cloudflare fires the Worker's scheduled() handler on this cron, whether or
# not anyone has AMV open. Every 5 minutes it looks for due automations,
# runs them, and stores the results for the user.
[triggers]
crons = ["*/5 * * * *"]

[[kv_namespaces]]
binding = "AMV_KV"
id = "a6ebfd730a654c638402484b324c8311"

# ── THIS is what makes usage limits actually hold ──
# Quota enforcement is "read usage → compare to cap → call the model → add usage".
# With a plain KV counter that read-then-write is NOT atomic: 20 parallel requests
# all read the same number, all pass the check, and all bill you. A user with
# devtools could blow straight through their plan.
#
# AMVCounter is a Durable Object - a single-threaded actor per counter - so
# increments are serialised and the cap genuinely holds under concurrency.
#
# WITHOUT this binding the Worker silently falls back to the non-atomic KV path.
# It keeps working, but your limits become suggestions.
[[durable_objects.bindings]]
name = "AMV_COUNTER"
class_name = "AMVCounter"

[[migrations]]
tag = "v1"
new_classes = ["AMVCounter"]

# ── THIS is what lets Crew operate websites that have no API ──
# Browser Rendering gives the Worker a real headless browser, so the web agent
# (/v1/browser/run) can navigate, fill forms, click and submit as the user - the
# capability behind "do it on any website".
#
# Requires the Workers PAID plan. Uncomment to enable; the Worker feature-detects
# env.BROWSER, so while this is commented out web automation degrades honestly
# ("not enabled on this deployment") instead of failing at runtime.
#
# This used to say "Nothing else changes when you turn it on", and that was
# false: it also needs nodejs_compat, which is set at the top of this file now.
# Without it the driver's own import of node:buffer fails and the feature is
# refused for ever with a message blaming npm. The flag is on, so uncommenting
# these two lines really is all there is to it - but the sentence only became
# true when the flag was added, not when it was written.
#
# It was ALSO held back on four security findings, and those are now closed:
#   - a page could get a saved password typed into its own form (AMV-001)
#   - a redirect reached an internal address before anything checked (AMV-002)
#   - the spending ceiling was optional to the caller and charged too early (AMV-036)
# A run also refuses to start at all if the browser driver cannot block requests
# before they are made, so turning this on cannot quietly get the weaker version.
#
# [browser]
# binding = "BROWSER"

# Secrets (set with: wrangler secret put NAME)
#   AMV_MODEL_KEY       - required, so the model can be called
#   JWT_SECRET          - required, to authenticate users
#   ADMIN_TOKEN         - required, for the error dashboard + admin password reset
#   EMAIL_API_KEY       - required, or password-reset emails never send
#   RESET_EMAIL_FROM    - optional; without it, Resend's default sender is used
#                         (which only delivers to YOUR OWN address)
#   GLOBAL_DAILY_USD_CAP - optional (defaults to $500). A global ceiling on what
#                         AMV can cost you in a day across ALL users. This is
#                         your protection against a runaway bill.
