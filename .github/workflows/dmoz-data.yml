# Builds data/dmoz/<topic>.json from the Open Directory (DMOZ) final dump
# on archive.org (scripts/dmoz-data.mjs): the sites people filed under the
# categories of the Integrations topics Wikidata covers thinly. Nothing from
# it is shown unless the site is in the Chrome UX Report. Commits the data
# to the branch it ran on, so it is reviewed like code.
name: dmoz-data
on:
  push:
    branches: ['claude/**']
    paths: ['data/dmoz/request.txt']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: dmoz-data-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Read the Open Directory dump
        timeout-minutes: 75
        run: |
          TOPICS="$(grep -v '^#' data/dmoz/request.txt | tr '\n' ' ')"
          node scripts/dmoz-data.mjs $TOPICS
      - name: Commit the data
        if: always()
        run: |
          git config user.name "amv-data-bot"
          git config user.email "amv-data-bot@users.noreply.github.com"
          git add data/dmoz
          if git diff --cached --quiet; then echo "nothing changed"; exit 0; fi
          git commit -m "Open Directory services for the thin Integrations topics"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
