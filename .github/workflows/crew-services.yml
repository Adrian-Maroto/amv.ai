# Finds the official website of every service Crew's jobs name for a country
# (COUNTRY_FACTS, scripts/crew-services.mjs) so Integrations lists each one.
# Commits data/crew-services/<CC>.json to the branch it ran on.
name: crew-services
on:
  push:
    branches: ['claude/**']
    paths: ['data/crew-services/request.txt']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: crew-services-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Query Wikidata
        timeout-minutes: 120
        env:
          BUDGET_MIN: '110'
        run: |
          CCS="$(grep -v '^#' data/crew-services/request.txt | tr '\n' ' ')"
          node scripts/crew-services.mjs $CCS
      - name: Commit the data
        if: always()
        run: |
          git config user.name "amv-data-bot"
          git config user.email "amv-data-bot@users.noreply.github.com"
          git add data/crew-services
          if git diff --cached --quiet; then echo "nothing changed"; exit 0; fi
          git commit -m "Services Crew names, per country, from Wikidata"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
