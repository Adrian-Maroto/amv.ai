name: tests

# Markdown never reaches the build, so a docs-only commit does not need thirty
# minutes of browsers to prove it. Every other path still does.
# WHERE THIS RUNS, AND WHY NOT EVERYWHERE.
#
# A Stop hook pushes the working branch after every turn so nothing is lost if a
# session dies. Those commits are work in progress by definition - the local gate
# has not finished on them yet - and CI was running every one and emailing a
# failure for each. That is where a mailbox full of red comes from, and it
# teaches the only bad lesson available: that a failure email means nothing.
#
# So CI runs where a red result is a real answer. `main` only carries commits the
# gate has already passed, and a pull request is somebody deliberately asking.
# The working branch is a work surface and is left alone; it is still pushed, so
# the work is safe, it just is not judged half-finished.
on:
  push:
    branches: [main]
    paths-ignore: ['**.md']
  pull_request:
    paths-ignore: ['**.md']

# ONE RESULT PER COMMIT.
#
# Work lands on the feature branch and a Stop hook fast-forwards main to the
# same SHA seconds later, so every commit was triggering two identical runs -
# two sets of CI minutes and two emails for one piece of work, which is most of
# why a mailbox filled up with them. Grouping by SHA means the second push finds
# the first run already in the group and cancels it; a cancelled run does not
# email. When a branch and main genuinely differ, the SHAs differ and both still
# run.
concurrency:
  group: tests-${{ github.sha }}
  cancel-in-progress: true

# Least privilege: the workflow only needs to read the repo (AMV-041).
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    # The full suite drives real browsers; the default 6h would let a hung run
    # sit there burning minutes. This is generous against a ~35 minute gate.
    timeout-minutes: 75
    steps:
      # NOTE (AMV-041): for supply-chain hardening, pin these to full-length
      # commit SHAs (e.g. actions/checkout@<sha>) once you've verified them.
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # Reproducible install straight from the committed lockfile.
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      # THE SAME GATE THAT RUNS LOCALLY.
      #
      # This used to build and then run the suite directly, which is a subset:
      # it could not catch a committed index.html that no longer matches its
      # source, because it rebuilt first and made the question moot. `npm run
      # check` verifies the build is fresh, then runs everything, then the
      # deploy preflight - so green here means exactly what green on a laptop
      # means, and a commit cannot pass one and fail the other.
      - name: Health gate (build fresh, all suites, preflight)
        run: npm run check
