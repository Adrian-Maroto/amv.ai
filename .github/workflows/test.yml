name: tests

# Markdown never reaches the build, so a docs-only commit does not need thirty
# minutes of browsers to prove it. Every other path still does.
# WHERE THIS RUNS, AND WHY NOT EVERYWHERE.
#
# A Stop hook pushes the working branch after every turn so nothing is lost if a
# session dies. Those commits are work in progress by definition - the local gate
# has not finished on them yet - and CI was running every one and emailing a
# failure for each. That is where a mailbox full of red comes from, and it
# teaches the only bad lesson available: that a failure email means nothing.
#
# So CI runs where a red result is a real answer. `main` only carries commits the
# gate has already passed, and a pull request is somebody deliberately asking.
# The working branch is a work surface and is left alone; it is still pushed, so
# the work is safe, it just is not judged half-finished.
on:
  push:
    branches: [main]
    paths-ignore: ['**.md']
  pull_request:
    paths-ignore: ['**.md']

# ONE RESULT PER COMMIT.
#
# Work lands on the feature branch and a Stop hook fast-forwards main to the
# same SHA seconds later, so every commit was triggering two identical runs -
# two sets of CI minutes and two emails for one piece of work, which is most of
# why a mailbox filled up with them. Grouping by SHA means the second push finds
# the first run already in the group and cancels it; a cancelled run does not
# email. When a branch and main genuinely differ, the SHAs differ and both still
# run.
concurrency:
  group: tests-${{ github.sha }}
  cancel-in-progress: true

# Least privilege: the workflow only needs to read the repo (AMV-041).
permissions:
  contents: read

jobs:
  test:
    # Pinned, not "latest": GitHub moves ubuntu-latest to Ubuntu 26 on 2026-10-19,
    # which would change fonts, the browser and the sandbox under every suite
    # overnight. Move this deliberately, with a full gate on the new image.
    runs-on: ubuntu-24.04
    # The full suite drives real browsers; the default 6h would let a hung run
    # sit there burning minutes. This is generous against a ~35 minute gate.
    timeout-minutes: 75
    steps:
      # AMV-058: PINNED TO COMMITS, BECAUSE A TAG IS NOT A VERSION.
      #
      # These used to say @v4, under a note that deferred the pinning to some
      # later day - a comment describing the fix instead of being it, which is
      # the same class of defect as everything else found this week.
      #
      # A major tag is MUTABLE. Whoever controls the action's repository can
      # move v4 to any commit, and every run of this workflow then executes
      # whatever it now points at - with the repository checked out and the
      # runner's environment in reach. That is not a hypothetical supply-chain
      # shape; moved tags are how it has actually happened to other people.
      #
      # A commit SHA cannot be moved. Each is the v4.4.0 release of its action,
      # resolved from the upstream repository, with the version kept beside it
      # so an upgrade is a deliberate edit rather than something that happens
      # to a workflow nobody touched. To update: read the release notes, resolve
      # the new tag with `git ls-remote --tags`, and change both the SHA and the
      # comment together.
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5.1.0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444  # v5.0.0
        with:
          node-version: 22
      # Reproducible install straight from the committed lockfile.
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      # The bridge's fence is bubblewrap, and two suites measure it rather than
      # trusting it - so the runner needs it, as .claude/session-setup.sh does
      # for a session. Ubuntu 24.04 also restricts unprivileged user namespaces
      # through AppArmor, which is the thing bubblewrap is built on; lifted for
      # this throwaway runner only. Without this step those suites fail, CI is
      # red, and the Worker deploy (which waits for green) is skipped.
      # Xvfb, xdotool and ImageMagick: `amv-uses-the-screen-only-when-you-
      # started-it-so` drives the bridge's screen control against a real
      # virtual display and fails, rather than skipping, without them.
      - name: Install bubblewrap for the fence suites, and the screen tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq bubblewrap xvfb xdotool imagemagick
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
          bwrap --ro-bind / / --unshare-user true && echo "bubblewrap works"
      # THE SAME GATE THAT RUNS LOCALLY.
      #
      # This used to build and then run the suite directly, which is a subset:
      # it could not catch a committed index.html that no longer matches its
      # source, because it rebuilt first and made the question moot. `npm run
      # check` verifies the build is fresh, then runs everything, then the
      # deploy preflight - so green here means exactly what green on a laptop
      # means, and a commit cannot pass one and fail the other.
      - name: Health gate (build fresh, all suites, preflight)
        run: npm run check
