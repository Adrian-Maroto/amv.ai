# Builds data/global/<topic>.json from Wikidata (scripts/global-data.mjs): for
# each Integrations topic, the services used in every country - email
# providers, calendar and scheduling tools, messaging apps, file stores,
# password managers and the rest - each with its official website and
# Wikidata ID, ranked by how many Wikipedia editions cover it. Commits the
# data to the branch it ran on, so it is reviewed like code.
name: global-data
on:
  push:
    branches: ['claude/**']
    paths: ['data/global/request.txt']
  workflow_dispatch:
    inputs:
      topics:
        description: 'Topic ids separated by spaces (empty = all)'
        required: false
        default: ''
permissions:
  contents: write
concurrency:
  group: global-data-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Query Wikidata
        timeout-minutes: 150
        env:
          TOPICS: ${{ github.event.inputs.topics }}
          BUDGET_MIN: '120'
        run: |
          if [ -z "$TOPICS" ] && [ -f data/global/request.txt ]; then TOPICS="$(grep -v '^#' data/global/request.txt | tr '\n' ' ')"; fi
          node scripts/global-data.mjs $TOPICS
      - name: Commit the data
        if: always()
        run: |
          git config user.name "amv-data-bot"
          git config user.email "amv-data-bot@users.noreply.github.com"
          git add data/global
          if git diff --cached --quiet; then echo "nothing changed"; exit 0; fi
          git commit -m "Worldwide services per Integrations topic, from Wikidata: $(ls data/global/*.json | wc -l) topics"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
