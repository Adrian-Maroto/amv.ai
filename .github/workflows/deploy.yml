name: deploy

# THE WORKER ONLY EVER SHIPS CODE THAT WENT GREEN FIRST.
#
# `main` already carries only commits the local gate passed, and `tests` runs
# again on every push to it. This waits for THAT run to finish and to have
# succeeded before it deploys, so a red main can never reach the live Worker.
# `workflow_run` is what makes the ordering real rather than hoped for - two
# workflows on the same `push` trigger would race, and the deploy would usually
# win, which is the opposite of the point.
on:
  workflow_run:
    workflows: [tests]
    types: [completed]

# Never two deploys of the same repository at once: the second would be
# uploading a Worker while the first is still switching over.
concurrency:
  group: deploy-worker
  cancel-in-progress: false

# Least privilege. This reads the repository and talks to Cloudflare; it has no
# business writing anything back to GitHub.
permissions:
  contents: read

jobs:
  worker:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Three conditions, all of them load-bearing:
    #   - the tests run actually succeeded (not cancelled, not failed)
    #   - it was main, so a pull-request run cannot deploy anything
    #   - the run was for this repository, not a fork
    if: >
      github.event.workflow_run.conclusion == 'success'
      && github.event.workflow_run.head_branch == 'main'
      && github.event.workflow_run.head_repository.full_name == github.repository
    steps:
      # Pinned to commits, not tags, for the reason set out at length in
      # tests.yml: a major tag is mutable and whoever controls the action can
      # move it. These are the same two SHAs that workflow already uses.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
        with:
          # workflow_run checks out the default branch by default, which is not
          # necessarily the commit that passed. Deploy the exact SHA that went
          # green, or the thing that shipped is not the thing that was tested.
          ref: ${{ github.event.workflow_run.head_sha }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4.4.0
        with:
          node-version: 22

      # INERT UNTIL THE CREDENTIALS EXIST, RATHER THAN RED.
      #
      # This workflow is committed before the account it deploys to has been
      # wired up. Without this check every push to main would fail on a missing
      # token and email a failure for a step nobody had asked to run yet - and a
      # failure email that means "not configured" is how people learn to ignore
      # failure emails. It says so once, in plain words, and stops.
      - name: Check the Cloudflare credentials are set
        id: creds
        env:
          TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$TOKEN" ] || [ -z "$ACCOUNT" ]; then
            echo "ready=no" >> "$GITHUB_OUTPUT"
            {
              echo "### Deploy skipped - not connected to Cloudflare yet"
              echo
              echo "This is not a failure. The repository has no"
              echo '`CLOUDFLARE_API_TOKEN` / `CLOUDFLARE_ACCOUNT_ID` secret yet, so'
              echo "there is nothing to deploy to."
              echo
              echo "Add both under **Settings -> Secrets and variables -> Actions**"
              echo "and the next push to \`main\` deploys itself."
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "ready=yes" >> "$GITHUB_OUTPUT"
          fi

      # Straight from the committed lockfile, so the wrangler that deploys is
      # the exact version this repository was tested against - no floating
      # `npx wrangler@latest` picking up whatever shipped this morning.
      - name: Install from the lockfile
        if: steps.creds.outputs.ready == 'yes'
        run: npm ci

      # `npm run deploy`, not `wrangler deploy` directly: the package's
      # `predeploy` hook runs the deploy preflight, which is the check that
      # catches an unbound KV namespace, a missing Durable Object migration or
      # a stale build before any of it reaches the live Worker.
      - name: Preflight, then deploy the Worker
        if: steps.creds.outputs.ready == 'yes'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npm run deploy

      # A deploy that reports success and a backend that answers are different
      # claims. This makes the second one, against the domain people actually
      # use, so "it deployed" cannot stand in for "it works".
      - name: Check the live backend answers
        if: steps.creds.outputs.ready == 'yes'
        run: |
          for i in 1 2 3 4 5; do
            body="$(curl -fsS --max-time 15 https://api.amv.homes/v1/health || true)"
            case "$body" in
              *'"ok":true'*)
                echo "Live backend healthy: $body"
                exit 0
                ;;
            esac
            echo "Not healthy yet (attempt $i), waiting for the rollout..."
            sleep 6
          done
          echo "::error::The Worker deployed but https://api.amv.homes/v1/health did not report ok:true."
          exit 1

  # THE WEBSITE, READ BACK THE SAME WAY THE WORKER IS.
  #
  # The Worker deploys here and then proves itself against /v1/health. The
  # website had no equivalent: it is published by a static host watching `main`
  # on its own schedule, so "the gate passed and main moved" and "visitors have
  # the new page" were two separate facts with nothing joining them. A fix could
  # be merged, green, and deployed to the Worker while every visitor kept
  # downloading the old page, and the only signal would have been somebody
  # saying the bug is still there. That happened.
  #
  # This does not deploy the site and deliberately does not try to. The host
  # owns that, and adding a second publisher is how two things race to write the
  # same bucket. It asks one question instead - is what is being served the page
  # this commit built - and says so loudly when the answer is no.
  site:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # The same three guards as the Worker job, for the same reasons.
    if: >
      github.event.workflow_run.conclusion == 'success'
      && github.event.workflow_run.head_branch == 'main'
      && github.event.workflow_run.head_repository.full_name == github.repository
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Wait for the site to serve this build
        env:
          # A repository variable so the domain is not welded into the workflow;
          # unset, it checks the domain the product actually runs on.
          SITE: ${{ vars.SITE_URL || 'https://amv.homes' }}
        run: |
          set -u
          want="$(grep -o 'name="amv-build" content="[a-f0-9]*"' public/index.html \
                  | head -1 | sed 's/.*content="//; s/"//')"
          if [ -z "$want" ]; then
            echo "::error::public/index.html carries no build id. build.mjs stamps one; this commit was not built."
            exit 1
          fi
          echo "This commit built: $want"
          echo "Asking $SITE what it is serving."

          # Fifteen minutes. A static host queues, builds and swaps over on its
          # own schedule, and being slower than CI is normal, not broken.
          got=""
          for i in $(seq 1 45); do
            body="$(curl -fsS --max-time 20 "$SITE/" || true)"
            got="$(printf '%s' "$body" \
                   | grep -o 'name="amv-build" content="[a-f0-9]*"' \
                   | head -1 | sed 's/.*content="//; s/"//')"
            if [ "$got" = "$want" ]; then
              echo "Live site is serving $got - this build."
              exit 0
            fi
            echo "attempt $i: live=${got:-'(no build id / no answer)'} want=$want"
            sleep 20
          done

          {
            echo "### The live site is not serving this build"
            echo
            echo "- this commit built: \`$want\`"
            echo "- \`$SITE\` is serving: \`${got:-nothing readable}\`"
          } >> "$GITHUB_STEP_SUMMARY"
          if [ -z "$got" ]; then
            echo "::error::$SITE served no build id after 15 minutes. Either the host is not publishing, or it is not publishing the public/ folder."
          else
            echo "::error::$SITE is still serving build $got, not $want, after 15 minutes. The host has not picked up this commit."
          fi
          exit 1

      # WHAT THE HOST MUST NOT HAND OUT.
      #
      # The site is one file at the ROOT of this repository, so a host pointed
      # at the repository rather than at public/ serves amv-backend.js and
      # wrangler.toml to anyone who asks - which it did, confirmed live. A suite
      # checks the folder is correct; only this checks the HOST is pointed at
      # it, and that is a different claim that no amount of local testing makes.
      - name: Check the host is not handing out the source
        env:
          SITE: ${{ vars.SITE_URL || 'https://amv.homes' }}
        run: |
          set -u
          bad=0
          for f in amv-backend.js wrangler.toml package.json check.mjs app.js; do
            code="$(curl -s -o /dev/null -w '%{http_code}' --max-time 20 "$SITE/$f" || echo 000)"
            if [ "$code" = "200" ]; then
              echo "::error::$SITE/$f is being served to the public. The host is publishing the repository root, not public/."
              bad=1
            else
              echo "ok: /$f -> $code"
            fi
          done
          exit $bad
