name: deploy

# THE WORKER ONLY EVER SHIPS CODE THAT WENT GREEN FIRST.
#
# `main` already carries only commits the local gate passed, and `tests` runs
# again on every push to it. This waits for THAT run to finish and to have
# succeeded before it deploys, so a red main can never reach the live Worker.
# `workflow_run` is what makes the ordering real rather than hoped for - two
# workflows on the same `push` trigger would race, and the deploy would usually
# win, which is the opposite of the point.
on:
  workflow_run:
    workflows: [tests]
    types: [completed]

# Never two deploys of the same repository at once: the second would be
# uploading a Worker while the first is still switching over.
concurrency:
  group: deploy-worker
  cancel-in-progress: false

# Least privilege. This reads the repository and talks to Cloudflare; it has no
# business writing anything back to GitHub.
permissions:
  contents: read

jobs:
  worker:
    # Pinned, not "latest": GitHub moves ubuntu-latest to Ubuntu 26 on 2026-10-19,
    # which would change fonts, the browser and the sandbox under every suite
    # overnight. Move this deliberately, with a full gate on the new image.
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    # Three conditions, all of them load-bearing:
    #   - the tests run actually succeeded (not cancelled, not failed)
    #   - it was main, so a pull-request run cannot deploy anything
    #   - the run was for this repository, not a fork
    if: >
      github.event.workflow_run.conclusion == 'success'
      && github.event.workflow_run.head_branch == 'main'
      && github.event.workflow_run.head_repository.full_name == github.repository
    steps:
      # Pinned to commits, not tags, for the reason set out at length in
      # tests.yml: a major tag is mutable and whoever controls the action can
      # move it. These are the same two SHAs that workflow already uses.
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5.1.0
        with:
          # workflow_run checks out the default branch by default, which is not
          # necessarily the commit that passed. Deploy the exact SHA that went
          # green, or the thing that shipped is not the thing that was tested.
          ref: ${{ github.event.workflow_run.head_sha }}
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444  # v5.0.0
        with:
          node-version: 22

      # INERT UNTIL THE CREDENTIALS EXIST, RATHER THAN RED.
      #
      # This workflow is committed before the account it deploys to has been
      # wired up. Without this check every push to main would fail on a missing
      # token and email a failure for a step nobody had asked to run yet - and a
      # failure email that means "not configured" is how people learn to ignore
      # failure emails. It says so once, in plain words, and stops.
      - name: Check the Cloudflare credentials are set
        id: creds
        env:
          TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$TOKEN" ] || [ -z "$ACCOUNT" ]; then
            echo "ready=no" >> "$GITHUB_OUTPUT"
            {
              echo "### Deploy skipped - not connected to Cloudflare yet"
              echo
              echo "This is not a failure. The repository has no"
              echo '`CLOUDFLARE_API_TOKEN` / `CLOUDFLARE_ACCOUNT_ID` secret yet, so'
              echo "there is nothing to deploy to."
              echo
              echo "Add both under **Settings -> Secrets and variables -> Actions**"
              echo "and the next push to \`main\` deploys itself."
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "ready=yes" >> "$GITHUB_OUTPUT"
          fi

      # Straight from the committed lockfile, so the wrangler that deploys is
      # the exact version this repository was tested against - no floating
      # `npx wrangler@latest` picking up whatever shipped this morning.
      - name: Install from the lockfile
        if: steps.creds.outputs.ready == 'yes'
        run: npm ci

      # `npm run deploy`, not `wrangler deploy` directly: the package's
      # `predeploy` hook runs the deploy preflight, which is the check that
      # catches an unbound KV namespace, a missing Durable Object migration or
      # a stale build before any of it reaches the live Worker.
      - name: Preflight, then deploy the Worker
        if: steps.creds.outputs.ready == 'yes'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npm run deploy

      # A deploy that reports success and a backend that answers are different
      # claims. This makes the second one, against the domain people actually
      # use, so "it deployed" cannot stand in for "it works".
      - name: Check the live backend answers
        if: steps.creds.outputs.ready == 'yes'
        run: |
          for i in 1 2 3 4 5; do
            body="$(curl -fsS --max-time 15 https://api.amv.homes/v1/health || true)"
            case "$body" in
              *'"ok":true'*)
                echo "Live backend healthy: $body"
                exit 0
                ;;
            esac
            echo "Not healthy yet (attempt $i), waiting for the rollout..."
            sleep 6
          done
          echo "::error::The Worker deployed but https://api.amv.homes/v1/health did not report ok:true."
          exit 1

  # THE WEBSITE, READ BACK THE SAME WAY THE WORKER IS.
  #
  # The Worker deploys here and then proves itself against /v1/health. The
  # website had no equivalent: it is published by a static host watching `main`
  # on its own schedule, so "the gate passed and main moved" and "visitors have
  # the new page" were two separate facts with nothing joining them. A fix could
  # be merged, green, and deployed to the Worker while every visitor kept
  # downloading the old page, and the only signal would have been somebody
  # saying the bug is still there. That happened.
  #
  # This does not deploy the site and deliberately does not try to. The host
  # owns that, and adding a second publisher is how two things race to write the
  # same bucket. It asks one question instead - is what is being served the page
  # this commit built - and says so loudly when the answer is no.
  site:
    # Pinned, not "latest": GitHub moves ubuntu-latest to Ubuntu 26 on 2026-10-19,
    # which would change fonts, the browser and the sandbox under every suite
    # overnight. Move this deliberately, with a full gate on the new image.
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    # The same three guards as the Worker job, for the same reasons.
    if: >
      github.event.workflow_run.conclusion == 'success'
      && github.event.workflow_run.head_branch == 'main'
      && github.event.workflow_run.head_repository.full_name == github.repository
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5.1.0
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Wait for the site to serve this build
        env:
          # A repository variable so the domain is not welded into the workflow;
          # unset, it checks the domain the product actually runs on.
          SITE: ${{ vars.SITE_URL || 'https://amv.homes' }}
        run: |
          set -u
          want="$(grep -o 'name="amv-build" content="[a-f0-9]*"' public/index.html \
                  | head -1 | sed 's/.*content="//; s/"//')"
          if [ -z "$want" ]; then
            echo "::error::public/index.html carries no build id. build.mjs stamps one; this commit was not built."
            exit 1
          fi
          echo "This commit built: $want"
          echo "Asking $SITE what it is serving."

          # Fifteen minutes. A static host queues, builds and swaps over on its
          # own schedule, and being slower than CI is normal, not broken.
          got=""
          for i in $(seq 1 45); do
            body="$(curl -fsS --max-time 20 "$SITE/" || true)"
            got="$(printf '%s' "$body" \
                   | grep -o 'name="amv-build" content="[a-f0-9]*"' \
                   | head -1 | sed 's/.*content="//; s/"//')"
            if [ "$got" = "$want" ]; then
              echo "Live site is serving $got - this build."
              exit 0
            fi
            echo "attempt $i: live=${got:-'(no build id / no answer)'} want=$want"
            sleep 20
          done

          {
            echo "### The live site is not serving this build"
            echo
            echo "- this commit built: \`$want\`"
            echo "- \`$SITE\` is serving: \`${got:-nothing readable}\`"
          } >> "$GITHUB_STEP_SUMMARY"
          if [ -z "$got" ]; then
            echo "::error::$SITE served no build id after 15 minutes. Either the host is not publishing, or it is not publishing the public/ folder."
          else
            echo "::error::$SITE is still serving build $got, not $want, after 15 minutes. The host has not picked up this commit."
          fi
          exit 1

      # WHAT THE HOST MUST NOT HAND OUT.
      #
      # The site is one file at the ROOT of this repository, so a host pointed
      # at the repository rather than at public/ serves amv-backend.js and
      # wrangler.toml to anyone who asks - which it did, confirmed live. A suite
      # checks the folder is correct; only this checks the HOST is pointed at
      # it, and that is a different claim that no amount of local testing makes.
      # THE PAGE PEOPLE GET IS THE PAGE THAT WAS BUILT.
      #
      # The site now sits behind Cloudflare's proxy, and several of its features
      # rewrite HTML on the way out (email address obfuscation, script loaders,
      # injected beacons). AMV's policy pins its inline scripts by hash, so a page
      # altered in transit has those scripts refused and stops working for every
      # visitor - while the build id above still matches, because that is one
      # meta tag. This compares the whole page, byte for byte, with what the
      # build wrote, and says what was added when they differ.
      - name: Check every published file is byte-for-byte the build
        env:
          SITE: ${{ vars.SITE_URL || 'https://amv.homes' }}
        run: |
          set -u
          # Every file the host publishes, not only the page: the code sandbox
          # carries its own security policy, the bridge is code people run on
          # their own computers, and the offline helper decides what is cached.
          # A rewrite of any of them in transit breaks it the same way.
          bad=0
          while IFS= read -r f; do
            rel="${f#public/}"; [ "$rel" = "index.html" ] && url="$SITE/" || url="$SITE/$rel"
            if ! curl -fsS --compressed --max-time 30 "$url" -o /tmp/live.bin; then
              echo "::error::$url could not be fetched."; bad=1; continue
            fi
            if cmp -s "$f" /tmp/live.bin; then
              echo "ok: /$rel"
            else
              bad=1
              echo "::error::$url is not the file that was built ($(wc -c < "$f") built, $(wc -c < /tmp/live.bin) served)."
              grep -aoE '/cdn-cgi/[^"'\'' ]+|rocket-loader[^"'\'' ]*|data-cfemail|email-decode[^"'\'' ]*|beacon\.min\.js' /tmp/live.bin | sort -u | head -5 || true
            fi
          done < <(find public -type f | sort)
          if [ "$bad" != 0 ]; then
            {
              echo "### What visitors get is not what was built"
              echo
              echo "Something between the host and the visitor is changing files. In Cloudflare, turn off"
              echo "Email Address Obfuscation, Rocket Loader and any page-injected script for amv.homes."
            } >> "$GITHUB_STEP_SUMMARY"
          fi
          exit $bad

      - name: Check the host is not handing out the source
        env:
          SITE: ${{ vars.SITE_URL || 'https://amv.homes' }}
        run: |
          set -u
          bad=0
          for f in amv-backend.js wrangler.toml package.json check.mjs app.js; do
            code="$(curl -s -o /dev/null -w '%{http_code}' --max-time 20 "$SITE/$f" || echo 000)"
            if [ "$code" = "200" ]; then
              echo "::error::$SITE/$f is being served to the public. The host is publishing the repository root, not public/."
              bad=1
            else
              echo "ok: /$f -> $code"
            fi
          done
          exit $bad

      # DOES A BARE PATH WORK ON THIS HOST - REPORTED, NEVER FAILED.
      #
      # `/billing` only resolves if the host serves index.html for a path it has
      # no file for. That is one field in the host's dashboard and nothing in
      # this repository can read it, so the question used to live in DEPLOY.md
      # as something somebody had to remember to go and check.
      #
      # It does not fail the deploy, and that is deliberate rather than timid:
      # the app is correct either way. It writes the path form ONLY after seeing
      # the host serve one - arriving at /billing and running at all is the
      # proof - and until that proof turns up every address it writes is the
      # hash form, which needs nothing from the host. A deploy that went red
      # over an optional setting would teach somebody to ignore a red deploy.
      #
      # So it answers the question on every deploy instead, in the summary,
      # where the answer is either "on" or a short note saying how to turn it on.
      # THE SERVER AT THE SITE'S OWN ADDRESS (LESSONS 550).
      #
      # Safari keeps a cookie from the API's own host for seven days, so the
      # server is also mounted at <site>/api - but only once Cloudflare proxies
      # the site and routes /api/* to the Worker, which is set in the dashboard
      # and cannot be read from this repository. This says, on every deploy,
      # which of the two pieces is in place, so the page is pointed at the new
      # address only after it is proved to answer. Informational: the old
      # address keeps working either way, so nothing here goes red.
      - name: Say whether the server answers at the site's own address
        env:
          SITE: ${{ vars.SITE_URL || 'https://amv.homes' }}
        run: |
          set -u
          host="${SITE#https://}"; host="${host%%/*}"
          echo "DNS for $host:"
          for t in A AAAA CNAME NS; do
            printf '  %-5s ' "$t"; dig +short "$host" "$t" | tr '\n' ' '; echo
          done
          trace="$(curl -sS --max-time 20 "$SITE/cdn-cgi/trace" 2>&1 | head -c 400 || true)"
          if printf '%s' "$trace" | grep -q '^fl='; then proxied=yes; else proxied=no; fi
          echo "Proxied by Cloudflare: $proxied"
          printf '%s\n' "$trace" | grep -E '^(h|colo|http|tls)=' || printf '  trace answered: %s\n' "$(printf '%s' "$trace" | head -c 120)"
          code="$(curl -sS -o /tmp/pc.json -w '%{http_code}' --max-time 20 "$SITE/api/v1/public-config" || true)"
          head -c 160 /tmp/pc.json 2>/dev/null; echo
          echo "GET $SITE/api/v1/public-config -> $code"
          srv="$(curl -sSI --max-time 20 "$SITE/api/v1/public-config" 2>/dev/null | grep -iE '^(server|cf-ray|x-render-origin-server|rndr-id):' | tr -d '\r' || true)"
          echo "$srv"
          if [ "$code" = "200" ] && grep -q '{' /tmp/pc.json 2>/dev/null; then
            verdict="on: the server answers at $SITE/api"
          elif [ "$proxied" = "no" ]; then
            verdict="not yet: $SITE is not proxied by Cloudflare (orange cloud), so the /api route cannot run"
          else
            verdict="not yet: $SITE is proxied, but /api/* is not routed to the Worker (Workers Routes)"
          fi
          echo "Server at the site's own address: $verdict"
          {
            echo "### Server at the site's own address"
            echo
            echo "$verdict"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Say whether bare paths work on this host
        env:
          SITE: ${{ vars.SITE_URL || 'https://amv.homes' }}
        run: |
          set -u
          body="$(curl -fsS --max-time 20 "$SITE/billing" || true)"
          got="$(printf '%s' "$body"                  | grep -o 'name="amv-build" content="[a-f0-9]*"' | head -1)"
          if [ -n "$got" ]; then
            echo "Bare paths resolve: $SITE/billing served the app."
            {
              echo "### Bare paths: on"
              echo
              echo "\`$SITE/billing\` serves the app, so links like it work as sent."
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::notice::$SITE/billing does not serve the app, so bare paths are not enabled on this host. Nothing is broken - AMV uses the #/billing form until the host proves it can serve the other one."
            {
              echo "### Bare paths: not enabled (optional)"
              echo
              echo "\`$SITE/billing\` did not serve the app, so the host has no"
              echo "rewrite for paths it has no file for."
              echo
              echo "**Nothing is broken.** AMV only writes path addresses after"
              echo "seeing the host serve one, so it uses \`#/billing\` instead -"
              echo "which needs nothing from the host and survives a refresh."
              echo
              echo "To turn it on: the static site's **Redirects/Rewrites**, with"
              echo "source \`/*\`, destination \`/index.html\`, action **Rewrite**"
              echo "(a redirect would change the address and lose the path)."
              echo "See DEPLOY.md."
            } >> "$GITHUB_STEP_SUMMARY"
          fi
